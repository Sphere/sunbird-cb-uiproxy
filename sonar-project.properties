# SonarQube / SonarCloud scanner configuration.
#
# NO SECRETS HERE. The server URL and token are injected at runtime:
#   local  -> .env.sonar (git-ignored, see .env.sonar.example)
#   CI     -> SONAR_TOKEN secret / Jenkins credentials
#
# The same project key is used on both the local server and SonarCloud so that
# `npm run sonar:report` and `npm run sonar:gate` work unchanged against either.

sonar.projectKey=Sphere_sunbird-cb-uiproxy
sonar.projectName=sunbird-cb-uiproxy

# Required by SonarCloud only; harmless but unused on a local server.
sonar.organization=sphere

# --- What to analyze -------------------------------------------------------
sonar.sources=src
sonar.tests=test
sonar.test.inclusions=test/**/*.test.js
sonar.sourceEncoding=UTF-8

# Build output, dependencies, logs, runtime scratch dirs and secrets are never
# source. Note: src/keys and src/publicApi_v8/keys are git-ignored already.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/.nyc_output/**,\
  **/logs/**,\
  **/user_upload/**,\
  **/nodemon/**,\
  **/types/**,\
  **/src/keys/**,\
  **/src/publicApi_v8/keys/**,\
  **/src/static-data/**,\
  gulpfile.ts

# --- Coverage & test execution --------------------------------------------
# INTENTIONALLY DISABLED. This repo currently has no unit-test harness: the two
# suites under test/integration are black-box HTTP calls against a live
# deployment and never import src/, so instrumented coverage of src/ is 0% by
# construction. Pointing Sonar at a report that does not exist makes it display
# a misleading "0.0%" instead of an honest "no data", and a stale committed
# xunit.xml made it report the same 5 tests on every run forever.
#
# Uncomment both lines once a real unit-test harness exists (mocha + ts-node +
# nyc, with "sourceMap": true enabled in tsconfig.json so lcov paths map back to
# src/*.ts). Until then the quality gate enforces the five non-coverage targets
# and leaves Coverage on New Code "not computed", which does not fail the gate.
#
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
# sonar.testExecutionReportPaths=xunit.xml

sonar.coverage.exclusions=\
  **/*.test.js,\
  **/src/index.ts,\
  **/src/server.ts,\
  **/src/configs/**,\
  **/src/utils/logger.ts
