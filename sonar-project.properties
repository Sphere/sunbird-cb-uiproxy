# SonarQube / SonarCloud scanner configuration.
#
# NO SECRETS HERE. The server URL and token are injected at runtime:
#   local  -> .env.sonar (git-ignored, see .env.sonar.example)
#   CI     -> SONAR_TOKEN secret / Jenkins credentials
#
# The same project key is used on both the local server and SonarCloud so that
# `npm run sonar:report` and `npm run sonar:gate` work unchanged against either.

sonar.projectKey=Sphere_sunbird-cb-uiproxy
sonar.projectName=sunbird-cb-uiproxy

# Required by SonarCloud only; harmless but unused on a local server.
sonar.organization=sphere

# --- What to analyze -------------------------------------------------------
# Unit tests are CO-LOCATED (src/utils/foo.ts + src/utils/foo.test.ts), so src
# is listed as both sources and tests and sonar.test.inclusions decides which is
# which. Without this, every *.test.ts is analysed as production code: it lands
# in the coverage denominator and is judged by production rules.
sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.test.js,**/test-support/**
sonar.sourceEncoding=UTF-8

# Build output, dependencies, logs, runtime scratch dirs and secrets are never
# source. Note: src/keys and src/publicApi_v8/keys are git-ignored already.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/.nyc_output/**,\
  **/logs/**,\
  **/user_upload/**,\
  **/nodemon/**,\
  **/types/**,\
  **/src/keys/**,\
  **/src/publicApi_v8/keys/**,\
  **/src/static-data/**,\
  gulpfile.ts

# --- Coverage ---------------------------------------------------------------
# Produced by `npm run test:coverage` (Jest + ts-jest, co-located unit tests).
# Run the tests before scanning or this file will be missing and coverage will
# read 0%: `npm run test:coverage && npm run sonar:scan`.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Test execution report is NOT configured. Jest would need an extra reporter
# dependency to emit one, and a stale committed xunit.xml previously made Sonar
# report the same five tests on every run forever. Coverage is the metric the
# quality gate acts on; test counts are visible in CI output.

# Kept deliberately SHORT. These are side-effectful bootstrap/infra files that
# cannot be meaningfully unit tested. Everything else stays in the denominator,
# so the reported coverage is the honest figure for the whole codebase — NOT the
# scoped number Jest prints for src/utils. Do not add files here merely because
# they are untested; that turns the metric into decoration.
sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.spec.ts,\
  **/*.test.js,\
  **/test-support/**,\
  **/src/index.ts,\
  **/src/server.ts,\
  **/src/configs/**,\
  **/src/utils/logger.ts,\
  **/src/utils/env.ts
