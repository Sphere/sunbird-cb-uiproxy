# SonarCloud analysis.
#
# ADDITIVE: this workflow only observes code. It does not build, package, or
# deploy the service, and it cannot affect any deployment path.
#
# Runs the Jest unit suite (src/**/*.test.ts, co-located, fully mocked — no
# network calls) with coverage before scanning, so real coverage data reaches
# Sonar via sonar.javascript.lcov.reportPaths instead of reading 0%.
#
# The SEPARATE suites under test/integration/ are NOT run here — those make
# real network calls to a deployed environment (one of them POSTs an
# assessment payload), so running them in CI would write data to a live
# system and let a flaky remote response fail the pipeline. They stay
# opt-in via `npm run test:integration`. See "Quarantined tests" in
# docs/sonarqube.md.
#
# Server-side setup required: the SONAR_TOKEN repository secret (Settings ->
# Secrets and variables -> Actions -> Repository secrets). Previously this
# job was gated behind a GitHub Environment named `sonarcloud`; every run
# since at least 2026-08-07, including plain push-to-master runs, failed at
# the SonarCloud scan step with "Failed to query JRE metadata ... HTTP 403
# ... check sonar.token" -- the environment secret was never resolving.
# Removed the environment gate so the job reads SONAR_TOKEN directly from
# repository secrets instead. Everything else is read from
# sonar-project.properties.

name: Build

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: Sonar needs blame data to attribute "new code"
          # correctly, which is what Clean-as-You-Code gates on.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Dependencies improve TypeScript analysis precision (type resolution)
      # and are needed to run the Jest suite below.
      # --ignore-scripts because no package lifecycle script needs to run just
      # to analyze/test source, and it keeps the job from executing arbitrary
      # code from a dependency's postinstall hook.
      # --legacy-peer-deps because tslint-config-airbnb's transitive tslint
      # plugins (tslint-eslint-rules, tslint-microsoft-contrib, tslint-sonarts)
      # declare a peer dependency on typescript ^2.x/^3.x, which conflicts
      # with this repo's typescript ^4.2.4 devDependency under npm's default
      # strict ERESOLVE behavior. This is a lint-tooling version mismatch,
      # not a real incompatibility (tslint itself works fine against
      # TypeScript 4.x here) — --legacy-peer-deps is npm's own suggested
      # remedy for exactly this shape of conflict.
      - name: Install dependencies
        run: npm install --ignore-scripts --legacy-peer-deps

      # Produces coverage/lcov.info, which sonar-project.properties points
      # Sonar at (sonar.javascript.lcov.reportPaths /
      # sonar.typescript.lcov.reportPaths). Jest's default coverageReporters
      # already include lcov (jest.config.js) — do not override
      # --coverageReporters here, that would silently skip regenerating it.
      - name: Test with coverage
        run: npm run test:coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
